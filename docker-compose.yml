version: '3.8'

services:
  # ============================================================================
  # 1. PostgreSQL 16: Durable Source of Truth
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: hooksentry_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-hooksentry}
      POSTGRES_USER: ${DB_USER:-hooksentry_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-hooksentry_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-hooksentry_user} -d ${DB_NAME:-hooksentry}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. Redis: Celery Message Broker
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: hooksentry_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 3. Django REST API (Event Ingestion & Dashboard Backend)
  # ============================================================================
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hooksentry_api
    restart: unless-stopped
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_data &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hooksentry-prod-grade-secret-key-992}
      - ALLOWED_HOSTS=*
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-TGcrbIkEoSUc7oZ9qEYqo_-vBG_uvByHnXof9UZLqsY=}
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-hooksentry}
      - DB_USER=${DB_USER:-hooksentry_user}
      - DB_PASSWORD=${DB_PASSWORD:-hooksentry_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
      - CORS_ALLOWED_ORIGINS=http://localhost:5173,http://localhost:3000,http://localhost:80
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 4. Celery Worker (Asynchronous Webhook Dispatcher)
  # ============================================================================
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hooksentry_worker
    restart: unless-stopped
    command: celery -A config worker -l info -c 4
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hooksentry-prod-grade-secret-key-992}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-TGcrbIkEoSUc7oZ9qEYqo_-vBG_uvByHnXof9UZLqsY=}
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-hooksentry}
      - DB_USER=${DB_USER:-hooksentry_user}
      - DB_PASSWORD=${DB_PASSWORD:-hooksentry_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 5. Transactional Outbox Publisher Service
  # ============================================================================
  publisher:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hooksentry_outbox_publisher
    restart: unless-stopped
    command: python manage.py publish_outbox --poll-interval 1.0
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hooksentry-prod-grade-secret-key-992}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-TGcrbIkEoSUc7oZ9qEYqo_-vBG_uvByHnXof9UZLqsY=}
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-hooksentry}
      - DB_USER=${DB_USER:-hooksentry_user}
      - DB_PASSWORD=${DB_PASSWORD:-hooksentry_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 6. Celery Beat (Lease Recovery Heartbeat & Periodic Maintenance)
  # ============================================================================
  beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hooksentry_beat
    restart: unless-stopped
    command: celery -A config beat -l info
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=True
      - SECRET_KEY=${SECRET_KEY:-django-insecure-hooksentry-prod-grade-secret-key-992}
      - FIELD_ENCRYPTION_KEY=${FIELD_ENCRYPTION_KEY:-TGcrbIkEoSUc7oZ9qEYqo_-vBG_uvByHnXof9UZLqsY=}
      - USE_SQLITE=False
      - DB_NAME=${DB_NAME:-hooksentry}
      - DB_USER=${DB_USER:-hooksentry_user}
      - DB_PASSWORD=${DB_PASSWORD:-hooksentry_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # ============================================================================
  # 7. React + Vite Frontend Dashboard
  # ============================================================================
  frontend:
    image: node:20-alpine
    container_name: hooksentry_frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api/v1
    command: sh -c "npm install && npm run dev -- --host"
    depends_on:
      - api

volumes:
  postgres_data:

