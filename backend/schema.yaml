          readOnly: true
        name:
          type: string
          maxLength: 255
        prefix:
          type: string
          readOnly: true
        raw_key:
          type: string
          readOnly: true
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - last_used_at
      - name
      - prefix
      - raw_key
      - workspace
    APIKeyRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 255
        is_active:
          type: boolean
        expires_at:
          type: string
          format: date-time
          nullable: true
      required:
      - name
    ActionEnum:
      enum:
      - WORKSPACE_CREATED
      - WORKSPACE_UPDATED
      - ENDPOINT_CREATED
      - ENDPOINT_UPDATED
      - ENDPOINT_DELETED
      - SECRET_ROTATED
      - DELIVERY_REPLAYED
      - API_KEY_CREATED
      - API_KEY_REVOKED
      - MEMBER_ADDED
      - MEMBER_ROLE_CHANGED
      - MEMBER_REMOVED
      type: string
      description: |-
        * `WORKSPACE_CREATED` - Workspace Created
        * `WORKSPACE_UPDATED` - Workspace Updated
        * `ENDPOINT_CREATED` - Endpoint Created
        * `ENDPOINT_UPDATED` - Endpoint Updated
        * `ENDPOINT_DELETED` - Endpoint Deleted
        * `SECRET_ROTATED` - Secret Rotated
        * `DELIVERY_REPLAYED` - Delivery Replayed
        * `API_KEY_CREATED` - API Key Created
        * `API_KEY_REVOKED` - API Key Revoked
        * `MEMBER_ADDED` - Member Added
        * `MEMBER_ROLE_CHANGED` - Member Role Changed
        * `MEMBER_REMOVED` - Member Removed
